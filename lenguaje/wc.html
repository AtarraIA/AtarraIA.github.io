:root{
  --bg:#000000; --ink:#ffffff; --grey:#888888;
  --blue:#58c4dd; --orange:#ff9a3c; --gold:#f0ac5f;
  --serif:'LM Roman','Latin Modern Roman','Computer Modern',Georgia,serif;
  --mono:'LM Mono','Latin Modern Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html, body{margin:0; height:100%; overflow:hidden}
body{background:var(--bg); color:var(--ink); font-family:var(--serif)}
/* la misma cara que las láminas de PCA y UMAP (mapa.html?solo) */
#lienzo{position:fixed; inset:0; width:100%; height:100%; cursor:grab; touch-action:none}
#lienzo.arrastra{cursor:grabbing}
.txt{position:fixed; pointer-events:none; z-index:3}
#s-tit{left:2.3vw; top:1.6vw; font-size:3.4vw; line-height:1}
#s-sub{right:2.3vw; top:2.6vw; font-family:var(--mono); font-size:1.1vw; color:#bbb; text-align:right; line-height:1.7}
#s-sub .pt{display:inline-block; width:.75vw; height:.75vw; border-radius:50%; margin:0 .4vw 0 1.2vw; vertical-align:middle}
#s-pie{left:12vw; right:12vw; bottom:1.2vw; text-align:center; font-family:var(--mono); font-size:1.05vw; color:#999}
#s-pie b{font-weight:400; color:var(--blue)} #s-pie i{font-style:normal; color:var(--orange)}
#ctl{position:fixed; left:2.3vw; top:6vw; z-index:4; display:flex; align-items:center; gap:.6vw; font-family:var(--mono); font-size:1.05vw; color:#999}
#ctl select, #ctl button{font:inherit; font-family:var(--serif); font-size:1.35vw; color:#fff; background:rgba(0,0,0,.7); cursor:pointer;
  border:1.5px solid #555; border-radius:.5vw; padding:.25vw .6vw; outline:none; transition:border-color .18s, color .18s}
#ctl select:hover, #ctl select:focus, #ctl button:hover{border-color:var(--blue)}
#ctl option{background:#000}
#buscar{font:inherit; font-family:var(--serif); font-size:1.35vw; color:var(--blue); font-style:italic; background:rgba(0,0,0,.7); width:12vw;
  border:1.5px solid #555; border-radius:.5vw; padding:.25vw .6vw; outline:none}
#buscar:focus{border-color:var(--blue)} #buscar.mal{border-color:#fc6255; color:#fc6255}
#vistas{display:flex; gap:.4vw; margin-left:1vw}
#ctl button.si{border-color:var(--blue); color:var(--blue)}
#aviso{position:fixed; left:2.3vw; top:9vw; font-family:var(--mono); font-size:.95vw; color:#999}
#letras{position:fixed; right:1.6vw; bottom:1.4vw; width:2.4vw; height:2.4vw; z-index:4; border-radius:50%; border:1.5px solid #555; background:rgba(0,0,0,.6);
  color:#bbb; cursor:pointer; padding:0; font:italic 1.05vw var(--serif); transition:border-color .18s, color .18s}
#letras:hover, #letras.si{border-color:var(--blue); color:var(--blue)}
/* al hacer clic en un azul: recorrer la palabra y sus vecinas */
#nav{position:fixed; left:50%; bottom:4.6vw; transform:translateX(-50%); z-index:4; display:flex; align-items:center; gap:.8vw;
  font-family:var(--serif); font-size:1.35vw; color:#ddd; white-space:nowrap}
#nav[hidden]{display:none}
#nav button{width:2.6vw; height:2.6vw; border-radius:50%; border:1.5px solid #555; background:rgba(0,0,0,.7); color:#ddd; cursor:pointer;
  padding:0; font:1.5vw var(--serif); line-height:1; transition:border-color .18s, color .18s}
#nav button:hover{border-color:var(--blue); color:var(--blue)}
#nav b{font-weight:400; color:var(--blue)} #nav span.n{font-family:var(--mono); font-size:1vw; color:#999}
.tip{position:fixed; pointer-events:none; background:#111; border:1px solid #333; padding:6px 10px;
  font-family:var(--mono); font-size:14px; line-height:1.5; display:none; z-index:5; max-width:520px}
.tip .w{font-family:var(--serif); font-size:21px}
</style>

<body>
<canvas id="lienzo"></canvas>

  <span id="vistas"><button data-vista="junto" class="si">W y C</button><button data-vista="w">solo W</button><button data-vista="c">solo C</button></span>
  <span style="margin-left:1vw">buscar</span><input id="buscar" list="vocab" spellcheck="false" autocomplete="off" placeholder="una palabra"><datalist id="vocab"></datalist></div>

<div id="nav" hidden><button id="ant" title="Anterior" aria-label="Anterior">‹</button><span id="nav-t"></span><button id="sig" title="Siguiente" aria-label="Siguiente">›</button></div>
<div class="txt" id="s-pie"></div>
<button id="letras" class="si" title="Mostrar u ocultar las palabras" aria-label="Mostrar u ocultar las palabras">Aa</button>
<div class="tip" id="tip"></div>

<script>
const MODELOS = [{"id": "palabras", "nombre": "Nuestro corpus (word2vec)"}, {"id": "bpe-8000", "nombre": "Nuestro corpus con BPE, k = 8000 (word2vec)"}, {"id": "bpe-20000", "nombre": "Nuestro corpus con BPE, k = 20000 (word2vec)"}, {"id": "fasttext-wiki-es", "nombre": "fastText wiki.es (preentrenado)"}];
// ?modelo=id&vista=junto|w|c
const PARAM = new URLSearchParams(location.search);
const F = 1.7;                               // letra y puntos del tamaño de las láminas
const datos = {};
window.registrarWC = (id, d) => { datos[id] = d; };
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const miles = n => n.toLocaleString('es').replace(/\./g, ' ');
const AZUL = [88, 196, 221], NARANJA = [255, 154, 60];

function bytes(b64){ const s = atob(b64), a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a.buffer; }
// cada coordenada viene en 16 bits; se lleva a una caja común (centrada, el 96 % central en [−1, 1]) para que las vistas se puedan mezclar
function coords(par){
  const v = par.map(c => Array.from(new Uint16Array(bytes(c.q)), q => c.lo + q / 65535 * (c.hi - c.lo))), n = v[0].length;
  const est = v.map(a => { const o = a.slice().sort((x, y) => x - y); return [o[Math.floor(n * .02)], o[Math.floor(n * .98)]]; });
  const e = 2 / Math.max(est[0][1] - est[0][0], est[1][1] - est[1][0]);
  const P = new Float32Array(2 * n);
  for (let i = 0; i < n; i++){ P[2 * i] = (v[0][i] - (est[0][0] + est[0][1]) / 2) * e; P[2 * i + 1] = (v[1][i] - (est[1][0] + est[1][1]) / 2) * e; }
  return P;
}
function matriz(q, s, n, d){
  const Q = new Int8Array(bytes(q)), S = new Float32Array(bytes(s)), M = new Float32Array(n * d);
  for (let i = 0; i < n; i++) for (let j = 0; j < d; j++) M[i * d + j] = Q[i * d + j] * S[i];
  return M;
}
/* los puntos son 2N: 0…N−1 los W (azules), N…2N−1 los C (naranjas). Cada vista da un lugar a los 2N;
   en «solo W» los C se quedan donde estaban en la vista conjunta, pero invisibles (y al revés) */
function preparar(M){
  if (M.listo) return;
  const N = M.n, J = coords(M.junto), Pw = coords(M.w), Pc = coords(M.c);
  const una = (azules, naranjas) => { const P = new Float32Array(4 * N); P.set(azules); P.set(naranjas, 2 * N); return P; };
  M.P = {junto: J, w: una(Pw, J.subarray(2 * N)), c: una(J.subarray(0, 2 * N), Pc)};
  M.Wf = matriz(M.W, M.Ws, N, M.d); M.Cf = matriz(M.C, M.Cs, N, M.d);
  const lf = M.frec.map(f => Math.log(f)), lo = Math.min(...lf), hi = Math.max(...lf);
  M.nivel = lf.map(v => (v - lo) / (hi - lo || 1));
  M.indice = new Map(M.vocab.map((w, i) => [w, i]));
  M.listo = true;
}
const VIS = {junto: [1, 1], w: [1, 0], c: [0, 1]};

let M = null, vista = PARAM.get('vista') in VIS ? PARAM.get('vista') : 'junto', P = null, vis = VIS[vista].slice();
let cam = {x: 0, y: 0, s: 1, s0: 1};       // pantalla = (dato - centro) * s + mitad
let sobre = null, dist = null, grupo = null;  // grupo: la palabra del clic, sus vecinas y cuál se mira (k = 0 es la original)  // dist: σ(C·W) de la palabra señalada, con sus índices ordenados de menor a mayor
const lienzo = $('lienzo'), ctx = lienzo.getContext('2d');
let ancho = 0, alto = 0, dpr = 1, letras = true;
function medir(){
  dpr = window.devicePixelRatio || 1; ancho = innerWidth; alto = innerHeight;
  lienzo.width = Math.round(ancho * dpr); lienzo.height = Math.round(alto * dpr);
}
const aPantalla = i => [(P[2 * i] - cam.x) * cam.s + ancho / 2, -(P[2 * i + 1] - cam.y) * cam.s + alto / 2];
const nombre = i => M.vocab[i % M.n];

/* la distribución de una palabra: σ(C_c · W_palabra) para cada uno de los N contextos */
function distribucion(w){
  const N = M.n, d = M.d, s = new Float32Array(N), Wf = M.Wf, Cf = M.Cf;
  for (let c = 0; c < N; c++){ let z = 0; for (let j = 0; j < d; j++) z += Wf[w * d + j] * Cf[c * d + j]; s[c] = 1 / (1 + Math.exp(-z)); }
  const orden = Array.from(s.keys()).sort((a, b) => s[a] - s[b]);
  return {w, s, orden};
}
const VECINAS = 10;
/* las vecinas por coseno en el espacio completo de W */
function vecinasW(w){
  const N = M.n, d = M.d, Wf = M.Wf, s = new Float32Array(N);
  let nw = 0; for (let j = 0; j < d; j++) nw += Wf[w * d + j] ** 2;
  for (let i = 0; i < N; i++){
    let z = 0, ni = 0;
    for (let j = 0; j < d; j++){ z += Wf[w * d + j] * Wf[i * d + j]; ni += Wf[i * d + j] ** 2; }
    s[i] = i === w ? -Infinity : z / Math.sqrt(nw * ni || 1);
  }
  const vecinas = Array.from(s.keys()).sort((a, b) => s[b] - s[a]).slice(0, VECINAS);
  return {vecinas, cos: vecinas.map(i => s[i])};
}
const actual = () => grupo ? (grupo.k ? grupo.vecinas[grupo.k - 1] : grupo.origen) : sobre;
function ponerGrupo(i){
  grupo = i === null ? null : {origen: i, ...vecinasW(i), k: 0};
  navegar(0);
}
/* siempre dentro de las vecinas de la palabra original: original → 1 → … → 10 → original */
function navegar(paso){
  if (grupo){
    grupo.k = (grupo.k + paso + VECINAS + 1) % (VECINAS + 1);
    const w = esc(nombre(grupo.origen));
    $('nav-t').innerHTML = grupo.k ? `vecina ${grupo.k} de ${VECINAS} de ${w}: <b>${esc(nombre(actual()))}</b> <span class="n">· coseno ${grupo.cos[grupo.k - 1].toFixed(2).replace('.', ',')}</span>`
                                   : `<b>${w}</b> <span class="n">(la original)</span>`;
  }
  $('nav').hidden = !grupo;
  ponerActiva(); avisar();
}
/* incrustada en la presentación: le dice cuándo quiere el teclado (las flechas, con una palabra fija; todo, mientras se escribe) */
function avisar(){
  if (parent !== window) parent.postMessage({webTeclado: {flechas: !!grupo, escribe: document.activeElement === $('buscar')}}, '*');
}
/* buscar una palabra: queda fija como con un clic */
function buscar(){
  const w = $('buscar').value.trim(), i = M.indice.get(w);
  $('buscar').classList.toggle('mal', w !== '' && i === undefined);
  if (i === undefined) return;
  if (vista === 'c') ponerVista('junto', false);
  ponerGrupo(i);
  // si ya se ve, la cámara no se mueve (así siguen a la vista los naranjas); si no, va hacia ella
  const [px, py] = aPantalla(i);
  if (px > 40 && px < ancho - 40 && py > 160 && py < alto - 120){ $('buscar').blur(); return; }
  const c0 = {...cam}, t0 = performance.now(), x1 = P[2 * i], y1 = P[2 * i + 1];
  const paso = ahora => {
    let t = Math.min(1, (ahora - t0) / 600); t = 1 - Math.pow(1 - t, 3);
    cam = {...c0, x: c0.x + (x1 - c0.x) * t, y: c0.y + (y1 - c0.y) * t};
    dibujar();
    if (t < 1) requestAnimationFrame(paso);
  };
  requestAnimationFrame(paso);
  $('buscar').blur();
}
$('buscar').addEventListener('focus', avisar);
$('buscar').addEventListener('blur', avisar);
$('buscar').addEventListener('keydown', e => { if (e.key === 'Enter') buscar(); e.stopPropagation(); });
$('buscar').addEventListener('input', e => { $('buscar').classList.remove('mal'); if (e.inputType === 'insertReplacementText' || !e.inputType) buscar(); });
$('ant').addEventListener('click', () => navegar(-1));
$('sig').addEventListener('click', () => navegar(1));
function tecla(k){
  if (!grupo) return false;
  if (k === 'ArrowRight') navegar(1); else if (k === 'ArrowLeft') navegar(-1); else if (k === 'Escape') ponerGrupo(null); else return false;
  return true;
}
/* sin palabra fija, las teclas de pasar lámina vuelven a la presentación (si está incrustada) */
const PASA = {ArrowRight: 1, ArrowDown: 1, PageDown: 1, ' ': 1, ArrowLeft: -1, ArrowUp: -1, PageUp: -1};
addEventListener('keydown', e => {
  if (e.target === $('buscar') || e.target === sel || tecla(e.key)) return;
  if (parent !== window && PASA[e.key]){ e.preventDefault(); parent.postMessage({webPasa: PASA[e.key]}, '*'); }
});
addEventListener('message', e => { if (e.data && e.data.webTecla) tecla(e.data.webTecla); });
function ponerActiva(){
  const a = actual();
  if (a === null) dist = null;
  else if (!dist || dist.w !== a) dist = distribucion(a);
  pie(); redibujar();
}

function etiquetas(cand){
  const celdas = new Set(), puestas = [], C = 14;
  const ocupa = (x, y, w, h, marcar) => {
    for (let cx = Math.floor(x / C); cx <= Math.floor((x + w) / C); cx++)
      for (let cy = Math.floor(y / C); cy <= Math.floor((y + h) / C); cy++){
        const k = cx * 100003 + cy;
        if (!marcar && celdas.has(k)) return true;
        if (marcar) celdas.add(k);
      }
    return false;
  };
  ctx.font = `${15 * F}px "LM Roman", Georgia, serif`;
  const max = Math.round((260 + 40 * Math.log2(Math.max(1, cam.s / cam.s0))) / (F * F));
  for (const [i, forzar] of cand){
    if (puestas.length >= max && !forzar) break;
    const [x, y] = aPantalla(i);
    if (x < -50 || x > ancho + 50 || y < -20 || y > alto + 20) continue;
    const w = ctx.measureText(nombre(i)).width, bx = x + 4, by = y - 16 * F;
    if (!forzar && ocupa(bx, by, w, 15 * F, false)) continue;
    ocupa(bx, by, w, 15 * F, true);
    puestas.push([i, bx, y - 3]);
  }
  return puestas;
}
function punto(x, y, r, rgb, a){
  ctx.fillStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a.toFixed(3)})`;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.fill();
}
function anillo(x, y, r, c){
  ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI);
  ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.stroke();
  ctx.lineWidth = 1.6; ctx.strokeStyle = c; ctx.stroke();
}
function dibujar(){
  if (!M) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, ancho, alto);
  const N = M.n, r = F * Math.max(1.2, Math.min(3, 1.2 * Math.sqrt(cam.s / cam.s0)));
  const fuera = (x, y) => x < -6 || x > ancho + 6 || y < -6 || y > alto + 6;
  let cand;
  if (dist){
    /* una palabra señalada: los azules siguen ahí, más tenues; los C brillan y crecen según σ(C·W) */
    for (let i = N - 1; i >= 0; i--){
      const [x, y] = aPantalla(i), t = M.nivel[i];
      if (fuera(x, y) || vis[0] < .01) continue;
      punto(x, y, r * (.55 + 1.1 * t * t), AZUL, vis[0] * (.12 + .3 * t));
    }
    for (const c of dist.orden){
      const [x, y] = aPantalla(N + c), s = dist.s[c];
      if (fuera(x, y) || vis[1] < .01) continue;
      punto(x, y, r * (.45 + 1.6 * s), NARANJA, vis[1] * (.05 + .95 * s * s));
    }
    // con un clic, también la original y sus vecinas, en azul; la que se mira lleva el anillo
    const azules = grupo ? [grupo.origen, ...grupo.vecinas] : [dist.w];
    for (const i of azules){ const [x, y] = aPantalla(i); punto(x, y, r * 2, AZUL, 1); }
    if (grupo && grupo.k){ const [x, y] = aPantalla(grupo.origen); anillo(x, y, 7, '#58c4dd'); }
    const [x, y] = aPantalla(dist.w);
    anillo(x, y, 9, '#ffffff');
    // la que se mira y la original siempre; las otras vecinas y los contextos más probables, de mayor a menor, mientras no se pisen
    cand = [...azules.map(i => [i, i === dist.w || i === azules[0]]), ...dist.orden.slice(-60).reverse().map(c => [N + c, false])];
  } else {
    /* todo: primero los menos frecuentes, para que los frecuentes queden encima */
    for (let i = N - 1; i >= 0; i--){
      for (const [k, rgb] of [[0, AZUL], [1, NARANJA]]){
        if (vis[k] < .01) continue;
        const [x, y] = aPantalla(k * N + i), t = M.nivel[i];
        if (fuera(x, y)) continue;
        punto(x, y, r * (.55 + 1.1 * t * t), rgb, vis[k] * (.3 + .65 * t));
      }
    }
    cand = [];
    for (let i = 0; i < N && cand.length < 12000; i++){ if (vis[0] > .5) cand.push([i, false]); if (vis[1] > .5) cand.push([N + i, false]); }
  }
  if (!letras && !dist) return;
  for (const [i, x, y] of etiquetas(cand)){
    const esW = i < N;
    ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.strokeText(nombre(i), x, y);
    ctx.fillStyle = dist ? (esW ? (i === dist.w ? '#ffffff' : '#bfe6f0') : '#ffc28a') : (esW ? '#bfe6f0' : '#ffd2a8');
    ctx.fillText(nombre(i), x, y);
  }
}
let pendiente = false;
const redibujar = () => { if (!pendiente){ pendiente = true; requestAnimationFrame(() => { pendiente = false; dibujar(); }); } };

/* el encuadre de una vista: el 98 % central de los puntos visibles, con margen para los títulos */
function encuadre(v){
  const Q = M.P[v], N = M.n, xs = [], ys = [];
  for (let k = 0; k < 2; k++) if (VIS[v][k]) for (let i = k * N; i < (k + 1) * N; i++){ xs.push(Q[2 * i]); ys.push(Q[2 * i + 1]); }
  const q = a => { a.sort((x, y) => x - y); return [a[Math.floor(a.length * .01)], a[Math.floor(a.length * .99)]]; };
  const [x0, x1] = q(xs), [y0, y1] = q(ys);
  const s = Math.min(ancho * .9 / (x1 - x0 || 1), (alto - 260) / (y1 - y0 || 1));
  return {x: (x0 + x1) / 2, y: (y0 + y1) / 2 + 20 / s, s, s0: s};
}
/* el cambio de vista: los puntos viajan, la cámara vuelve al encuadre y los que salen se desvanecen */
function ponerVista(nueva, animada){
  vista = nueva;
  document.querySelectorAll('#vistas button').forEach(b => b.classList.toggle('si', b.dataset.vista === vista));
  if (vista === 'c'){ sobre = null; dist = null; grupo = null; $('nav').hidden = true; }
  textos();
  const B = M.P[vista], v1 = VIS[vista], c1 = encuadre(vista);
  if (!animada || !P){ P = B.slice(); vis = v1.slice(); cam = c1; pie(); dibujar(); return; }
  const A = P.slice(), v0 = vis.slice(), c0 = {...cam}, t0 = performance.now(), T = 1100;
  const paso = ahora => {
    let t = Math.min(1, (ahora - t0) / T);
    t = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    for (let k = 0; k < A.length; k++) P[k] = A[k] + (B[k] - A[k]) * t;
    vis = [v0[0] + (v1[0] - v0[0]) * t, v0[1] + (v1[1] - v0[1]) * t];
    cam = {x: c0.x + (c1.x - c0.x) * t, y: c0.y + (c1.y - c0.y) * t, s: Math.exp(Math.log(c0.s) + (Math.log(c1.s) - Math.log(c0.s)) * t), s0: c1.s0};
    dibujar();
    if (t < 1) requestAnimationFrame(paso);
  };
  requestAnimationFrame(paso);
  pie();
}
function textos(){
  $('s-tit').textContent = {junto: 'W y C', w: 'UMAP de W', c: 'UMAP de C'}[vista];
  $('s-sub').innerHTML = (vista === 'junto' ? 'W y C como un solo conjunto de vectores' : vista === 'w' ? 'los vectores de palabra' : 'los vectores de contexto') +
    ' · UMAP con coseno<br>' + (vista !== 'c' ? '<span class="pt" style="background:var(--blue)"></span>W, las palabras' : '') +
    (vista !== 'w' ? '<span class="pt" style="background:var(--orange)"></span>C, los contextos' : '');
}
function pie(){
  if (!M) return;
  const bpe = activo && activo.startsWith('bpe'), unidad = bpe ? 'tokens' : 'palabras';
  const a = actual();
  if (a !== null && dist){
    const w = esc(nombre(a)), top = dist.orden.slice(-5).reverse().map(c => esc(nombre(c)) + ' ' + dist.s[c].toFixed(2).replace('.', ',')).join(', ');
    $('s-pie').innerHTML = `<b>W<sub>${w}</sub></b> y los ${miles(M.n)} <i>C</i>: cada naranja brilla según σ(<i>C</i><sub>contexto</sub>·<b>W</b><sub>${w}</sub>), ` +
      `la probabilidad de que sea contexto de ${w} · los más altos: ${top}` + (grupo ? '' : ' · clic: sus vecinas');
  } else {
    const que = vista === 'w' ? '<b>azul</b>, su fila de W' : vista === 'c' ? '<i>naranja</i>, su fila de C' : '<b>azul</b> su fila de W, <i>naranja</i> su fila de C';
    $('s-pie').innerHTML = `cada punto es ${bpe ? 'un token' : 'una palabra'}: ${que} · ` +
      `${bpe ? "los" : "las"} ${miles(M.n)} ${unidad} más frecuentes de ${miles(M.total)} · ${M.d} dimensiones → 2` + (vista !== 'c' ? ' · pasa el ratón por un azul' : '');
  }
}

/* ratón: acercar, mover, señalar (solo los azules) y, con clic, fijar una palabra con sus vecinas */
function masCercana(mx, my, radio, desde, hasta){
  let mejor = null, md = radio * radio;
  for (let i = desde; i < hasta; i++){
    const [x, y] = aPantalla(i), d = (x - mx) ** 2 + (y - my) ** 2;
    if (d < md){ md = d; mejor = i; }
  }
  return mejor;
}
const azulCercano = (mx, my) => vis[0] > .5 ? masCercana(mx, my, 14 * F, 0, M.n) : null;
let arrastre = null;
lienzo.addEventListener('wheel', e => {
  if (!M) return;
  e.preventDefault();
  const mx = e.clientX, my = e.clientY, f = Math.exp(-e.deltaY * .0015);
  const dx = (mx - ancho / 2) / cam.s + cam.x, dy = -(my - alto / 2) / cam.s + cam.y;
  cam.s *= f; cam.x = dx - (mx - ancho / 2) / cam.s; cam.y = dy + (my - alto / 2) / cam.s;
  redibujar();
}, {passive: false});
lienzo.addEventListener('pointerdown', e => { arrastre = {x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, movio: false}; lienzo.setPointerCapture(e.pointerId); });
lienzo.addEventListener('pointermove', e => {
  if (!M) return;
  const mx = e.clientX, my = e.clientY, t = $('tip');
  if (arrastre){
    const dx = mx - arrastre.x, dy = my - arrastre.y;
    if (Math.abs(dx) + Math.abs(dy) > 3){ arrastre.movio = true; lienzo.classList.add('arrastra'); }
    if (arrastre.movio){ cam.x = arrastre.cx - dx / cam.s; cam.y = arrastre.cy + dy / cam.s; t.style.display = 'none'; redibujar(); return; }
  }
  // en «solo C» se señalan los naranjas, solo para leer su nombre
  const i = vista === 'c' ? masCercana(mx, my, 10 * F, M.n, 2 * M.n) : azulCercano(mx, my);
  if (vista !== 'c' && i !== sobre){ sobre = i; if (!grupo) ponerActiva(); }
  if (i === null){ t.style.display = 'none'; return; }
  const esW = i < M.n;
  t.innerHTML = `<div class="w" style="color:${esW ? 'var(--blue)' : 'var(--orange)'}">${esc(nombre(i))}</div>` +
    `${esW ? 'W' : 'C'}<sub>${esc(nombre(i))}</sub> · aparece ${miles(M.frec[i % M.n])} veces · puesto ${i % M.n + 1}`;
  t.style.display = 'block';
  t.style.left = Math.min(mx + 16, innerWidth - t.offsetWidth - 8) + 'px';
  t.style.top = (my + 18) + 'px';
});
lienzo.addEventListener('pointerup', e => {
  if (arrastre && !arrastre.movio && vista !== 'c') ponerGrupo(azulCercano(e.clientX, e.clientY));      // clic en el vacío: se suelta
  arrastre = null; lienzo.classList.remove('arrastra');
});
lienzo.addEventListener('pointerleave', () => { $('tip').style.display = 'none'; if (sobre !== null){ sobre = null; if (!grupo) ponerActiva(); } });
addEventListener('resize', () => { medir(); redibujar(); });
document.querySelectorAll('#vistas button').forEach(b => b.addEventListener('click', () => { if (M && b.dataset.vista !== vista) ponerVista(b.dataset.vista, true); }));
$('letras').addEventListener('click', () => { letras = !letras; $('letras').classList.toggle('si', letras); redibujar(); });

/* el modelo: el mismo selector que en las láminas, y se recuerda entre páginas */
const sel = $('modelo'), CLAVE = 'mapa-modelo';
let activo = null;
sel.innerHTML = MODELOS.map(m => `<option value="${m.id}">${esc(m.nombre)}</option>`).join('');
function usar(id){
  M = datos[id]; activo = id; preparar(M);
  sobre = null; dist = null; grupo = null; $('nav').hidden = true;
  $('vocab').innerHTML = M.vocab.map(w => `<option value="${esc(w)}">`).join('');
  ponerVista(vista, false);
}
function cargar(id){
  if (datos[id]){ usar(id); return; }
  $('aviso').textContent = 'cargando…';
  const s = document.createElement('script');
  s.src = `mapas/${id}-wc.js`;
  s.onload = () => { $('aviso').textContent = ''; if (sel.value === id) usar(id); };
  s.onerror = () => { s.remove(); if (activo) sel.value = activo;
    $('aviso').textContent = `no encuentro mapas/${id}-wc.js (se arma con slides_src/espacio.py --wc)`; };
  document.head.appendChild(s);
}
sel.addEventListener('change', () => { try { localStorage.setItem(CLAVE, sel.value); } catch (e) {} cargar(sel.value); });
try { const g = localStorage.getItem(CLAVE); if (g && MODELOS.some(m => m.id === g)) sel.value = g; } catch (e) {}
if (PARAM.get('modelo') && MODELOS.some(m => m.id === PARAM.get('modelo'))) sel.value = PARAM.get('modelo');
medir();
cargar(sel.value);
</script>
