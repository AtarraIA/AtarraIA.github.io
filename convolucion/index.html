<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convolución — AtarraIA</title>
<style>
/* Estilo base y motor tomados de lenguaje/tokenizacion.html (ver construir.py) */
:root{
  --bg:#000000;
  --ink:#ffffff;
  --grey:#888888;
  --grey-d:#4a4a4a;
  --blue:#58c4dd; --blue-b:#9cdceb; --blue-e:#1c758a;
  --teal:#5cd0b3;
  --green:#83c167;
  --gold:#f0ac5f;
  --yellow:#e8e000;
  --red:#fc6255;
  --maroon:#c55f73;
  --purple:#9a72ac;
  --fg:#ffffff;
  --sans:'Roboto','Helvetica Neue',Arial,sans-serif;
  --serif:'LM Roman','Latin Modern Roman','Computer Modern',Georgia,serif;
  --mono:'LM Mono','Latin Modern Mono',ui-monospace,'SF Mono',Menlo,monospace;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--serif);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---------- stage ---------- */
#viewport{
  position:fixed; left:0; right:0; top:0; bottom:104px;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
#fondo{position:absolute; inset:0; z-index:0}
#fondo canvas{display:block; width:100%; height:100%}
#stage{
  width:1600px; height:900px; position:relative; z-index:1;
  transform-origin:center center;
  flex:none;
}
.slide{
  position:absolute; inset:0;
  padding:76px 180px;
  display:flex; flex-direction:column;
  opacity:0; visibility:hidden;
  transition:opacity .34s ease, visibility .34s;
}
.slide.active{opacity:1; visibility:visible}
.slide.center{align-items:center; justify-content:center; text-align:center}
.slide.mid{justify-content:center}

/* ---------- type ---------- */
h1,h2,h3,p{margin:0}
.t-hero{font-size:112px; line-height:1.06; letter-spacing:-.012em}
.t-section{font-size:82px; line-height:1.1; letter-spacing:-.01em}
.t-title{font-size:60px; line-height:1.12; letter-spacing:-.008em; margin-bottom:34px}
.t-lead{font-size:42px; line-height:1.42}
.t-body{font-size:29px; line-height:1.62}
.t-body.grande{font-size:35px; line-height:1.6}
.t-small{font-size:23px; line-height:1.6; color:var(--grey)}
.t-tiny{font-size:19px; line-height:1.6; color:var(--grey)}
.mono{font-family:var(--mono)}
.sans{font-family:var(--sans); font-weight:300; letter-spacing:.002em}
.sans .t-body{font-size:27px; line-height:1.7}
.dim{color:var(--grey)}
.it{font-style:italic}
.measure{max-width:1240px; margin-left:auto; margin-right:auto}
.measure-n{max-width:1000px; margin-left:auto; margin-right:auto}
.stack>*+*{margin-top:26px}
.stack-s>*+*{margin-top:14px}
.stack-l>*+*{margin-top:44px}

.c-blue{color:var(--blue); --fg:var(--blue)}
.c-teal{color:var(--teal); --fg:var(--teal)}
.c-green{color:var(--green); --fg:var(--green)}
.c-gold{color:var(--gold); --fg:var(--gold)}
.c-red{color:var(--red); --fg:var(--red)}
.c-maroon{color:var(--maroon); --fg:var(--maroon)}
.c-purple{color:var(--purple); --fg:var(--purple)}
.c-grey{color:var(--grey); --fg:var(--grey)}

.rule{display:block; height:3px; background:var(--fg,var(--blue)); width:190px; border-radius:2px}
.slide.center .rule{margin:38px auto 0}

/* ---------- animation units ---------- */
.el{--st:38ms}
.w{display:inline-block; white-space:pre}
.u{display:inline-block; position:relative; opacity:0; will-change:opacity,top,filter}
.m-fade .u{display:inline}

/* Nothing inside a beat shows before its turn: text hides per unit, and the
   container hides everything else it draws (borders, icons, images, canvases). */
.el:not(.on):not(.leaving){opacity:0}
.el.on{opacity:1}
.stage:not(.on):not(.leaving) > *{opacity:0}

/* fade (per word) */
.el:not(.on) .u{opacity:0}
.el.on.m-fade .u{animation:uFade .58s cubic-bezier(.22,.68,.3,1) both; animation-delay:calc(var(--i)*var(--st))}
@keyframes uFade{
  from{opacity:0; top:.34em; filter:blur(5px)}
  to  {opacity:1; top:0; filter:blur(0)}
}

/* write (per character, manim-style outline then fill) */
.m-write .u{color:transparent; -webkit-text-stroke:.02em var(--fg); text-stroke:.02em var(--fg)}
.el.on.m-write .u{animation:uWrite .8s cubic-bezier(.3,.72,.28,1) both; animation-delay:calc(var(--i)*var(--st))}
@keyframes uWrite{
  0%  {opacity:0; color:transparent; -webkit-text-stroke-color:var(--fg); top:.09em; transform:scale(.9); filter:blur(4px)}
  42% {opacity:1; color:transparent; -webkit-text-stroke-color:var(--fg); top:0; transform:none; filter:blur(0)}
  100%{opacity:1; color:var(--fg); -webkit-text-stroke-color:transparent; top:0; transform:none; filter:blur(0)}
}

/* leaving */
.el.leaving .u{animation:uOut .3s ease-in both; animation-delay:calc(var(--i)*6ms)}
.el.leaving.m-write .u{animation-name:uOutW}
@keyframes uOut{
  from{opacity:1; top:0; filter:blur(0)}
  to  {opacity:0; top:-.16em; filter:blur(5px)}
}
@keyframes uOutW{
  from{opacity:1; color:var(--fg); -webkit-text-stroke-color:transparent; top:0; filter:blur(0)}
  to  {opacity:0; color:var(--fg); -webkit-text-stroke-color:transparent; top:-.16em; filter:blur(5px)}
}

/* instant (scrubbing far) — colour is left to inherit so .hl.lit still wins */
.el.on.instant .u{animation:none!important; opacity:1; top:0; transform:none; filter:none}
.el.on.instant.m-write .u{color:var(--fg); -webkit-text-stroke-color:transparent}

/* rule */
.el.m-rule .rule{transform:scaleX(0); transform-origin:left center}
.el.on.m-rule .rule{animation:ruleIn .66s cubic-bezier(.2,.7,.3,1) both}
.el.on.instant.m-rule .rule{animation:none; transform:none}
.el.leaving.m-rule .rule{animation:ruleOut .26s ease-in both}
@keyframes ruleIn{from{transform:scaleX(0)} to{transform:scaleX(1)}}
@keyframes ruleOut{from{transform:scaleX(1)} to{transform:scaleX(0)}}

/* ---------- images ---------- */
.el.m-draw .frame{position:relative; display:block; width:100%; line-height:0; opacity:0}
.el.m-draw img{display:block; width:100%; height:auto}
.el.on.m-draw .frame{animation:imgIn .68s cubic-bezier(.2,.7,.3,1) both}
.el.on.instant.m-draw .frame{animation:none; opacity:1}
.el.leaving.m-draw .frame{animation:imgOut .28s ease-in both}
@keyframes imgIn{from{opacity:0; transform:scale(.94); filter:blur(7px)} to{opacity:1; transform:none; filter:blur(0)}}
@keyframes imgOut{from{opacity:1} to{opacity:0; transform:scale(.97); filter:blur(6px)}}

/* manim-style Create(Rectangle): the four edges draw in sequence */
.bx{position:absolute; inset:-1px; pointer-events:none}
.bx i{position:absolute; background:var(--fg); display:block}
.bx i:nth-child(1){top:0; left:0; width:100%; height:2px; transform:scaleX(0); transform-origin:left center}
.bx i:nth-child(2){top:0; right:0; width:2px; height:100%; transform:scaleY(0); transform-origin:center top}
.bx i:nth-child(3){bottom:0; right:0; width:100%; height:2px; transform:scaleX(0); transform-origin:right center}
.bx i:nth-child(4){bottom:0; left:0; width:2px; height:100%; transform:scaleY(0); transform-origin:center bottom}
.el.on .bx i:nth-child(1){animation:lineX .2s linear .18s both}
.el.on .bx i:nth-child(2){animation:lineY .2s linear .38s both}
.el.on .bx i:nth-child(3){animation:lineX .2s linear .58s both}
.el.on .bx i:nth-child(4){animation:lineY .2s linear .78s both}
.el.on.instant .bx i{animation:none!important; transform:none}
.el.leaving .bx i{animation:none!important; transform:none; opacity:0; transition:opacity .2s}
@keyframes lineX{to{transform:scaleX(1)}}
@keyframes lineY{to{transform:scaleY(1)}}

.cap{font-size:20px; color:var(--grey); margin-top:16px; text-align:center; line-height:1.45;
  opacity:0; transition:opacity .45s ease .3s}
.el.on .cap{opacity:1}
.el.instant .cap{transition:none}

/* ---------- highlight beats ---------- */
.hl{transition:color .5s ease, text-shadow .5s ease}
.hl.instant{transition:none}
.hl.lit{color:var(--gold); text-shadow:0 0 22px rgba(240,172,95,.38)}
.hl.lit.hl-b{color:var(--blue); text-shadow:0 0 22px rgba(88,196,221,.38)}
.hl.lit.hl-g{color:var(--green); text-shadow:0 0 22px rgba(131,193,103,.34)}
.hl.lit.hl-r{color:var(--red); text-shadow:0 0 22px rgba(252,98,85,.34)}

.slidetag{
  position:absolute; left:180px; top:42px;
  font-size:18px; letter-spacing:.16em; text-transform:uppercase; color:var(--grey-d);
}

/* ---------- controls ---------- */
#bar{
  position:fixed; left:0; right:0; bottom:0; height:104px;
  display:flex; align-items:center; gap:26px;
  padding:0 34px;
  background:linear-gradient(to top, rgba(0,0,0,.96), rgba(0,0,0,.72));
  border-top:1px solid #191919;
  font-family:var(--serif);
  z-index:10;
}
.btn{
  appearance:none; background:transparent; border:1px solid #2b2b2b; color:var(--ink);
  width:52px; height:52px; border-radius:50%; cursor:pointer;
  font-size:22px; line-height:1; display:flex; align-items:center; justify-content:center;
  transition:border-color .18s, background .18s, color .18s; flex:none;
  font-family:var(--serif);
}
.btn:hover{border-color:var(--blue); color:var(--blue)}
.btn:active{background:rgba(88,196,221,.12)}
.btn.wide{width:auto; padding:0 20px; border-radius:26px; font-size:18px; letter-spacing:.04em}

#track{position:relative; flex:1 1 auto; height:52px; display:flex; align-items:center}
#ticks{position:absolute; left:0; right:0; top:50%; height:20px; transform:translateY(-50%); pointer-events:none}
#ticks i{position:absolute; top:0; width:1px; height:20px; background:#333}
#slider{
  -webkit-appearance:none; appearance:none; width:100%; background:transparent; margin:0; cursor:pointer; position:relative; z-index:2;
}
#slider::-webkit-slider-runnable-track{height:4px; background:#262626; border-radius:3px}
#slider::-moz-range-track{height:4px; background:#262626; border-radius:3px}
#slider::-moz-range-progress{height:4px; background:var(--blue); border-radius:3px}
#slider::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none;
  width:22px; height:22px; border-radius:50%; background:var(--blue); margin-top:-9px;
  box-shadow:0 0 0 0 rgba(88,196,221,.28); transition:box-shadow .18s, transform .18s;
}
#slider:hover::-webkit-slider-thumb,#slider:active::-webkit-slider-thumb{box-shadow:0 0 0 10px rgba(88,196,221,.18)}
#slider::-moz-range-thumb{width:22px; height:22px; border:none; border-radius:50%; background:var(--blue)}
#fill{position:absolute; left:0; top:50%; height:4px; background:var(--blue); border-radius:3px; transform:translateY(-50%); pointer-events:none; z-index:1}

#meta{display:flex; align-items:baseline; gap:18px; flex:none; min-width:280px; justify-content:flex-end}
#count{font-family:var(--mono); font-size:20px; color:var(--grey)}
#label{font-size:21px; color:var(--grey-d); max-width:0; white-space:nowrap; overflow:hidden}
@media (min-width:900px){#label{max-width:320px; text-overflow:ellipsis}}

#hint{
  position:fixed; right:34px; bottom:118px; font-size:16px; color:var(--grey-d);
  opacity:1; transition:opacity .6s ease; pointer-events:none; z-index:9;
}
#hint.gone{opacity:0}

/* pantalla completa: la barra se esconde y la lámina ocupa todo.
   Vuelve a asomarse al acercar el ratón al borde inferior. */
body.fs #viewport{bottom:0}
body.fs #hint{display:none}
body.fs #bar{transform:translateY(100%); transition:transform .28s ease}
body.fs.bar-show #bar{transform:none}

/* ---------- láminas de convolución ---------- */
.slide.plena{padding:0}
.st{display:none}
.conv{position:absolute; inset:0; font-family:var(--serif)}
.conv .x{position:absolute; opacity:0; transition:opacity .5s ease, transform .5s ease}
.conv .x.vis{opacity:1}
.conv.quieto, .conv.quieto *{transition:none!important; animation:none!important}

.enc{left:0; right:0; top:52px; text-align:center; font-size:46px; color:var(--ink)}
.enc b{color:var(--gold); font-weight:normal}
.rot{font-size:22px; color:var(--grey); text-align:center; white-space:nowrap}

.cel{position:absolute; box-sizing:border-box; border:1px solid #555;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-weight:bold; line-height:1;
  transition:opacity .35s ease, transform .35s ease, background-color .4s ease, color .4s ease}
.cel.oculta{opacity:0; transform:scale(.8)}
.cel.ind{animation:indicar .42s ease both; z-index:3}
@keyframes indicar{
  0%{transform:scale(1); box-shadow:0 0 0 0 rgba(240,172,95,0)}
  50%{transform:scale(1.18); box-shadow:0 0 0 3px var(--gold), 0 0 18px rgba(240,172,95,.6)}
  100%{transform:scale(1); box-shadow:0 0 0 0 rgba(240,172,95,0)}}
.cel.vacia{background:#0d0d0d; border-color:#3a3a3a}

.caja{position:absolute; box-sizing:border-box; border:3px solid var(--gold); pointer-events:none;
  opacity:0; transform:scale(1.25);
  transition:opacity .35s ease, transform .45s cubic-bezier(.2,.7,.3,1), left .25s ease, top .25s ease}
.caja.vis{opacity:1; transform:none}

.gato{display:block}
.termos{display:grid; grid-template-columns:repeat(3, auto); gap:6px 34px; font-size:36px; line-height:1.3}
.termo{opacity:0; transform:translateY(10px); filter:blur(4px);
  transition:opacity .35s ease, transform .35s ease, filter .35s ease}
.termo.vis{opacity:1; transform:none; filter:none}
.neg{color:var(--blue)} .pos{color:var(--gold)} .cero{color:var(--grey)}
.raya{height:2px; background:var(--grey); transform:scaleX(0); transform-origin:left center; transition:transform .4s ease}
.raya.vis{transform:scaleX(1)}
.suma{font-size:52px; text-align:center; opacity:0; transition:opacity .45s ease}
.suma.vis{opacity:1}

.rev{position:absolute; overflow:hidden; height:0}
.rev canvas{position:absolute; left:0; top:0; display:block}
.marco{box-sizing:border-box; border:1.5px solid #3a3a3a; background:#0d0d0d}
.escaner{position:absolute; box-sizing:border-box; border:3px solid var(--gold); opacity:0; transition:opacity .3s ease}
.escaner.vis{opacity:1}
.miniatura{transform-origin:0 0; transition:transform .9s cubic-bezier(.3,.7,.2,1)}

</div>

<div id="hint">clic a la derecha o → para avanzar · a la izquierda o ← para volver</div>

<script>
(function(){
  'use strict';
  var stage = document.getElementById('stage');
  var viewport = document.getElementById('viewport');
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var slider = document.getElementById('slider');
  var fill = document.getElementById('fill');
  var ticks = document.getElementById('ticks');
  var countEl = document.getElementById('count');
  var labelEl = document.getElementById('label');
  var hint = document.getElementById('hint');
  var webhost = document.getElementById('webhost');

  /* ---------- split text into animatable units ---------- */
  function splitUnits(root, perChar){
    var i = 0, afterSpace = true;
    (function walk(node){
      var kids = Array.prototype.slice.call(node.childNodes);
      for (var k = 0; k < kids.length; k++){
        var n = kids[k];
        if (n.nodeType === 3){
          var text = n.nodeValue;
          if (!text) continue;
          if (!text.replace(/\s/g,'').length){ afterSpace = true; continue; }
          var frag = document.createDocumentFragment();
          var parts = text.split(/(\s+)/);
          for (var p = 0; p < parts.length; p++){
            var part = parts[p];
            if (part === '') continue;
            if (/^\s+$/.test(part)){
              frag.appendChild(document.createTextNode(part));
              afterSpace = true;
              continue;
            }
            if (perChar){
              var w = document.createElement('span');
              w.className = 'w';
              var chars = Array.from(part);
              for (var c = 0; c < chars.length; c++){
                var s = document.createElement('span');
                s.className = 'u';
                s.style.setProperty('--i', i++);
                s.textContent = chars[c];
                w.appendChild(s);
              }
              frag.appendChild(w);
            } else {
              var sw = document.createElement('span');
              sw.className = 'u';
              sw.style.setProperty('--i', i++);
              sw.textContent = part;
              frag.appendChild(sw);
            }
            afterSpace = false;
          }
          node.replaceChild(frag, n);
        } else if (n.nodeType === 1 && !n.classList.contains('u') && n.tagName !== 'BR' && !(n instanceof SVGElement)){
          walk(n);
        }
      }
    })(root);
    return i;
  }

  Array.prototype.forEach.call(document.querySelectorAll('.el.m-write, .el.m-fade'), function(el){
    var perChar = el.classList.contains('m-write');
    var total = splitUnits(el, perChar);
    if (!total) return;               // already carries hand-authored .u units (the token slide)
    var base = perChar ? 46 : 40;
    var budget = perChar ? 1500 : 1250;
    var st = total > 1 ? Math.max(4, Math.min(base, budget / total)) : base;
    el.style.setProperty('--st', st.toFixed(1) + 'ms');
  });

  /* ---------- build the beat timeline ---------- */
  var beats = [];
  slides.forEach(function(sl, si){
    var map = {};
    Array.prototype.forEach.call(sl.querySelectorAll('[data-b]'), function(el){
      var b = parseInt(el.dataset.b, 10);
      (map[b] = map[b] || []).push(el);
    });
    Object.keys(map).map(Number).sort(function(a,b){return a-b;}).forEach(function(k){
      beats.push({ slide: si, els: map[k] });
    });
  });

  slider.max = String(beats.length - 1);

  /* slide-boundary ticks */
  (function(){
    var html = '';
    for (var i = 1; i < beats.length; i++){
      if (beats[i].slide !== beats[i-1].slide){
        html += '<i style="left:' + (i / (beats.length - 1) * 100).toFixed(3) + '%"></i>';
      }
    }
    ticks.innerHTML = html;
  })();

  /* ---------- element state ---------- */
  var timers = new WeakMap();
  function clearTimer(el){
    var t = timers.get(el);
    if (t){ clearTimeout(t); timers.delete(el); }
  }
  /* Only ever touches an element whose state actually changes — otherwise removing
     .instant would re-trigger the write animation of a beat that is already on screen. */
  function setEl(el, on, animate){
    if (el.classList.contains('hl')){
      if (el.classList.contains('lit') === on) return;
      el.classList.toggle('instant', !animate);
      el.classList.toggle('lit', on);
      return;
    }
    var isOn = el.classList.contains('on');
    if (on){
      if (isOn) return;
      clearTimer(el);
      el.classList.remove('leaving');
      el.classList.toggle('instant', !animate);
      el.classList.add('on');
      return;
    }
    if (!isOn){
      if (!animate) el.classList.remove('leaving');
      return;
    }
    clearTimer(el);
    el.classList.remove('on', 'instant');
    if (animate){
      el.classList.add('leaving');
      timers.set(el, setTimeout(function(){ el.classList.remove('leaving'); timers.delete(el); }, 340));
    } else {
      el.classList.remove('leaving');
    }
  }

  var idx = 0, started = false;

  function setIndex(n, animate){
    if (n < 0) n = 0;
    if (n > beats.length - 1) n = beats.length - 1;
    var prev = idx;
    idx = n;
    var si = beats[n].slide;
    var slideChanged = beats[prev].slide !== si || !started;
    var anim = animate !== false && Math.abs(n - prev) <= 2 && started;
    started = true;

    slides.forEach(function(sl, i){ sl.classList.toggle('active', i === si); });

    var deferred = [];
    beats.forEach(function(bt, i){
      var on = bt.slide === si && i <= n;
      var a = anim && bt.slide === si && (i === n || (i === prev && !slideChanged));
      if (a && i === n && on && slideChanged){
        bt.els.forEach(function(el){ setEl(el, false, false); });
        deferred.push(bt);
        return;
      }
      bt.els.forEach(function(el){ setEl(el, on, a); });
    });
    if (deferred.length){
      setTimeout(function(){
        if (idx !== n) return;
        deferred.forEach(function(bt){ bt.els.forEach(function(el){ setEl(el, true, true); }); });
      }, 170);
    }

    /* la página real solo aparece (y solo se carga) en su lámina */
    var fondo = document.getElementById('fondo');
    if (fondo) fondo.hidden = !slides[si].querySelector('.fondomark');

    if (webhost){
      var marca = slides[si].querySelector('.webmark');
      if (marca){
        var ifr = webhost.querySelector('iframe');
        var shot = document.getElementById('webshot');
        var img = shot.querySelector('img');
        if (marca.dataset.img){
          if (img.getAttribute('src') !== marca.dataset.img) img.src = marca.dataset.img;
          shot.hidden = false; ifr.hidden = true; shot.scrollTop = 0;
        } else {
          shot.hidden = true; ifr.hidden = false;
          if (ifr.getAttribute('data-url') !== marca.dataset.src){
            ifr.setAttribute('data-url', marca.dataset.src);
            ifr.src = marca.dataset.src;
          }
        }
        webhost.style.backgroundColor = marca.dataset.bg || marca.dataset.img ? '#fff' : '#000';
      }
      webhost.hidden = !marca;
    }

    slider.value = String(n);
    var pct = beats.length > 1 ? n / (beats.length - 1) * 100 : 0;
    fill.style.width = pct + '%';
    countEl.textContent = (n + 1) + ' / ' + beats.length;
    labelEl.textContent = slides[si].dataset.label || '';
    if (n > 0 && hint) hint.classList.add('gone');
    try { history.replaceState(null, '', '#' + n); } catch (err) {}
  }

  /* ---------- controls ---------- */
  slider.addEventListener('input', function(){ setIndex(parseInt(slider.value, 10), true); });
  document.getElementById('prev').addEventListener('click', function(){ setIndex(idx - 1, true); });
  document.getElementById('next').addEventListener('click', function(){ setIndex(idx + 1, true); });
  document.getElementById('full').addEventListener('click', toggleFull);

  function toggleFull(){
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  }

  /* el teclado vuelve a la presentación en cuanto el ratón sale de la página */
  if (webhost){
    var ifr0 = webhost.querySelector('iframe');
    if (ifr0) ifr0.addEventListener('load', function(){ webhost.style.backgroundImage = 'none'; });
    webhost.querySelector('.webnav.prev').addEventListener('click', function(){ window.focus(); setIndex(idx - 1, true); });
    webhost.querySelector('.webnav.next').addEventListener('click', function(){ window.focus(); setIndex(idx + 1, true); });
    document.addEventListener('mousemove', function(){
      if (webhost.hidden) return;
      var a = document.activeElement;
      if (a && a.tagName === 'IFRAME'){ a.blur(); window.focus(); document.body.focus(); }
    });
  }

  var barTimer = null;
  document.addEventListener('fullscreenchange', function(){
    document.body.classList.toggle('fs', !!document.fullscreenElement);
    document.body.classList.remove('bar-show');
    fit();
  });
  document.addEventListener('mousemove', function(e){
    if (!document.body.classList.contains('fs')) return;
    var cerca = e.clientY > window.innerHeight - 150;
    document.body.classList.toggle('bar-show', cerca);
    if (cerca){
      clearTimeout(barTimer);
      barTimer = setTimeout(function(){ document.body.classList.remove('bar-show'); }, 2600);
    }
  });

  document.addEventListener('keydown', function(e){
    if (e.target === slider && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;
    switch (e.key){
      case 'ArrowRight': case 'ArrowDown': case ' ': case 'PageDown': case 'Enter':
        e.preventDefault(); setIndex(idx + 1, true); break;
      case 'ArrowLeft': case 'ArrowUp': case 'PageUp': case 'Backspace':
        e.preventDefault(); setIndex(idx - 1, true); break;
      case 'Home': e.preventDefault(); setIndex(0, false); break;
      case 'End': e.preventDefault(); setIndex(beats.length - 1, false); break;
      case 'f': case 'F': e.preventDefault(); toggleFull(); break;
    }
  });

  viewport.addEventListener('click', function(e){
    if (e.target.closest && e.target.closest('a')) return;
    if (e.clientX > window.innerWidth * 0.5) setIndex(idx + 1, true);
    else setIndex(idx - 1, true);
  });

  /* ---------- fit stage ---------- */
  function fit(){
    var w = viewport.clientWidth, h = viewport.clientHeight;
    var s = Math.min(w / 1600, h / 900);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  /* ---------- deep link (#12) ---------- */
  function fromHash(){
    var h = parseInt((location.hash || '').replace('#', ''), 10);
    return isNaN(h) ? 0 : h;
  }
  window.addEventListener('hashchange', function(){
    var h = fromHash();
    if (h !== idx) setIndex(h, false);
  });

  setIndex(fromHash(), false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>

        }), [
          [9 * 420, function () { ver(raya, true); }],
          [9 * 420 + 400, function () { ver(suma, true); }],
          [9 * 420 + 1000, function () { llenas[0].classList.remove('oculta'); }]
        ]),
        /* 5 · deslizar */
        desliz
      ]
    };
  });

  /* ════ Lámina 4 · Paso 3 (Sobel-X) y Paso 4 (Sobel-Y) en la imagen entera ════ */
  widget('w-sobel', function (host, api) {
    var enc3 = div(host, 'x enc', null, '<b>Paso 3.</b>&nbsp; Aplica Sobel-X a toda la imagen');
    var enc4 = div(host, 'x enc', null, '<b>Paso 4.</b>&nbsp; Aplica Sobel-Y a toda la imagen');

    var KC = 52, KX = 70, KY = 196;
    var kernel = rejillaKernel(host, SOBEL_X, KX, KY, KC, 20);
    var rotK = div(host, 'x rot', { left: KX - 20, width: 3 * KC + 40, top: KY - 38, fontSize: 20 }, 'Kernel Sobel-X');

    var W = 600, H = W * GATO_H / GATO_W, GX = 290, RX = 960, Y = 250;
    var gato = imagenGato(host, GX, Y, W);
    var rotG = div(host, 'x rot', { left: GX, width: W, top: Y + H + 16 }, 'Imagen de entrada');
    var marco = div(host, 'x marco', { left: RX, top: Y, width: W, height: H });
    var rotX = div(host, 'x rot', { left: RX, width: W, top: Y + H + 16 }, 'Mapa Sobel-X &nbsp;(bordes verticales)');
    var rotY = div(host, 'x rot', { left: RX, width: W, top: Y + H + 16 }, 'Mapa Sobel-Y &nbsp;(bordes horizontales)');

    /* los mapas se calculan aquí mismo sobre la foto, como precompute_sobel() */
    function lienzo() {
      var r = div(host, 'rev', { left: RX, top: Y, width: W });
      var c = document.createElement('canvas');
      c.width = GATO_W; c.height = GATO_H;
      c.style.width = W + 'px'; c.style.height = H + 'px';
      r.appendChild(c);
      return { rev: r, canvas: c };
    }
    var mx = lienzo(), my = lienzo();
    mx.rev.classList.add('miniatura');
    var TS = 200 / W;   /* la miniatura de Sobel-X, arriba a la derecha */
    var rotMini = div(host, 'x rot', { left: 1350, width: 200, top: 40 + H * TS + 8, fontSize: 18 }, 'Sobel-X');

    var img = new Image();
    img.onload = function () {
      var c = document.createElement('canvas');
      c.width = GATO_W; c.height = GATO_H;
      var cx = c.getContext('2d');
      cx.drawImage(img, 0, 0);
      var d = cx.getImageData(0, 0, GATO_W, GATO_H).data;
      var gris = new Float32Array(GATO_W * GATO_H);
      for (var p = 0; p < gris.length; p++) {
        gris[p] = Math.floor((d[4 * p] * 299 + d[4 * p + 1] * 587 + d[4 * p + 2] * 114) / 1000);
      }
      [[SOBEL_X, mx.canvas], [SOBEL_Y, my.canvas]].forEach(function (par) {
        var k = par[0], out = new Float32Array(gris.length), m = 0;
        function refl(i, n) { return i < 0 ? -i - 1 : i >= n ? 2 * n - i - 1 : i; }
        for (var y = 0; y < GATO_H; y++) for (var x = 0; x < GATO_W; x++) {
          var s = 0;
          for (var a = -1; a <= 1; a++) {
            var fila = refl(y + a, GATO_H) * GATO_W;
            for (var b = -1; b <= 1; b++) s += gris[fila + refl(x + b, GATO_W)] * k[a + 1][b + 1];
          }
          out[y * GATO_W + x] = s;
          if (Math.abs(s) > m) m = Math.abs(s);
        }
        var ctx = par[1].getContext('2d');
        var im = ctx.createImageData(GATO_W, GATO_H);
        for (p = 0; p < out.length; p++) {
          var v = Math.max(0, Math.min(255, out[p] / m * 127 + 127));
          im.data[4 * p] = im.data[4 * p + 1] = im.data[4 * p + 2] = v;
          im.data[4 * p + 3] = 255;
        }
        ctx.putImageData(im, 0, 0);
      });
    };
    img.src = GATO_SRC;

    /* el escáner recorre la foto en 6 filas × 8 columnas mientras el mapa se destapa */
    var SW = W * 0.08, SH = H * 0.10, FILAS = 6, COLS = 8, DUR = 2900;
    var escaner = div(host, 'escaner', { width: SW, height: SH, zIndex: 3 });
    function ponerEscaner(n) {
      var f = Math.floor(n / COLS), c = n % COLS;
      escaner.style.left = (GX + 3 + SW / 2 + c * (W - SW - 6) / (COLS - 1) - SW / 2) + 'px';
      escaner.style.top = (Y + 3 + SH / 2 + f * (H - SH - 6) / (FILAS - 1) - SH / 2) + 'px';
    }
    function barrer(rev, animar) {
      if (!animar) { rev.style.height = H + 'px'; ver(escaner, false); return; }
      var g = api.gen(), t0 = null;
      ponerEscaner(0); ver(escaner, true);
      (function cuadro(ts) {
        if (!api.vivo(g)) return;
        if (t0 === null) t0 = ts;
        var p = Math.min(1, (ts - t0) / DUR);
        var n = Math.min(FILAS * COLS - 1, Math.floor(p * FILAS * COLS));
        ponerEscaner(n);
        rev.style.height = (H * p) + 'px';
        if (p < 1) requestAnimationFrame(cuadro);
        else setTimeout(function () { if (api.vivo(g)) ver(escaner, false); }, 150);
      })(performance.now());
    }

    var todos = [enc3, enc4, rotK, gato, rotG, marco, rotX, rotY, rotMini];
    return {
      reset: function () {
        todos.forEach(function (e) { ver(e, false); });
        kernel.forEach(function (c, k) { c.classList.add('oculta'); c.style.transitionDelay = ''; pintarKernel(c, SOBEL_X[Math.floor(k / 3)][k % 3]); });
        rotK.textContent = 'Kernel Sobel-X';
        mx.rev.style.height = my.rev.style.height = '0px';
        mx.rev.style.transform = '';
        ver(escaner, false);
      },
      pasos: [
        /* 1 · la foto, el kernel y el lugar del resultado */
        [[0, function () {
          ver(enc3, true); kernel.forEach(function (c) { c.classList.remove('oculta'); }); ver(rotK, true);
          ver(gato, true); ver(rotG, true); ver(marco, true); ver(rotX, true);
        }]],
        /* 2 · barrido con Sobel-X */
        [[0, function (animar) { barrer(mx.rev, animar); }]],
        /* 3 · cambio a Sobel-Y: el mapa X se va a la esquina */
        [[0, function (animar) {
          ver(enc3, false); ver(enc4, true);
          mx.rev.style.transform = 'translate(' + (1350 - RX) + 'px,' + (40 - Y) + 'px) scale(' + TS + ')';
          ver(rotMini, true); ver(rotX, false); ver(rotY, true);
          rotK.textContent = 'Kernel Sobel-Y';
          kernel.forEach(function (c, k) {
            c.style.transitionDelay = animar ? (k * 45) + 'ms' : '';
            pintarKernel(c, SOBEL_Y[Math.floor(k / 3)][k % 3]);
            if (animar) setTimeout(function () { indicar(c); }, k * 45);
          });
        }]],
        /* 4 · barrido con Sobel-Y */
        [[0, function (animar) { barrer(my.rev, animar); }]]
      ]
    };
  });
})();
</script>
</body>
</html>
